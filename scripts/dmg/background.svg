<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420">
  <!-- Boreas DMG window background (660 x 420 pt). Same "Kutup Işığı" palette as docs/design/logo-final.svg.
       The two icons sit at (165,200) and (495,200), 128 pt each; the arrow and the caption stay clear of them.
       Rendered to PNG @1x and @2x by scripts/make-dmg.sh (scripts/render-svg.swift). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#040a1c"/><stop offset=".55" stop-color="#0c1938"/><stop offset="1" stop-color="#1b1243"/>
    </linearGradient>
    <radialGradient id="haloL" cx="165" cy="200" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#29c9ff" stop-opacity=".20"/><stop offset="1" stop-color="#29c9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloR" cx="495" cy="200" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a45cff" stop-opacity=".20"/><stop offset="1" stop-color="#a45cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aur1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2cffb0" stop-opacity="0"/><stop offset=".35" stop-color="#2cffb0" stop-opacity=".85"/><stop offset=".7" stop-color="#29c9ff" stop-opacity=".7"/><stop offset="1" stop-color="#a45cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aur2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a45cff" stop-opacity="0"/><stop offset=".5" stop-color="#a45cff" stop-opacity=".7"/><stop offset="1" stop-color="#ff5cc8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2cffb0" stop-opacity=".25"/><stop offset=".6" stop-color="#29c9ff" stop-opacity=".85"/><stop offset="1" stop-color="#e6f6ff" stop-opacity=".95"/>
    </linearGradient>
    <filter id="blur26" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="660" height="420" fill="url(#bg)"/>
  <!-- Aurora ribbons along the top, kept away from the caption at the bottom. -->
  <g filter="url(#blur26)">
    <path d="M-20 70 C 120 -10, 300 110, 680 30 L 680 100 C 320 190, 150 70, -20 140 Z" fill="url(#aur1)"/>
    <path d="M-20 130 C 160 70, 380 190, 680 100 L 680 150 C 400 250, 190 130, -20 190 Z" fill="url(#aur2)" opacity=".8"/>
  </g>
  <rect width="660" height="420" fill="url(#haloL)"/>
  <rect width="660" height="420" fill="url(#haloR)"/>

  <g fill="#fff">
    <circle cx="48" cy="52" r="1.8"/><circle cx="590" cy="38" r="1.6"/><circle cx="330" cy="26" r="1.3" fill-opacity=".7"/>
    <circle cx="612" cy="130" r="1.3"/><circle cx="26" cy="168" r="1.3" fill-opacity=".7"/><circle cx="430" cy="48" r="1.2" fill-opacity=".6"/>
    <circle cx="140" cy="36" r="1.2" fill-opacity=".6"/><circle cx="48" cy="330" r="1.2" fill-opacity=".5"/><circle cx="620" cy="320" r="1.4" fill-opacity=".6"/>
    <path d="M590 36 L 591.5 43 L 598.5 44.5 L 591.5 46 L 590 53 L 588.5 46 L 581.5 44.5 L 588.5 43 Z" fill-opacity=".9" transform="translate(0 -4)"/>
  </g>

  <!-- Frosted plates behind the Finder icon labels: Finder draws black labels in light mode and white in
       dark mode, and a mid-tone blue plate keeps both readable on the dark sky. -->
  <g fill="#5f86cf" fill-opacity=".82" stroke="#fff" stroke-opacity=".25" stroke-width="1">
    <rect x="115" y="272" width="100" height="24" rx="12"/>
    <rect x="435" y="272" width="120" height="24" rx="12"/>
  </g>

  <!-- Soft arrow between the two icon positions (icons span x 101..229 and 431..559). -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g filter="url(#glow)" stroke="#29c9ff" stroke-opacity=".7" stroke-width="9">
      <path d="M268 200 H 384"/><path d="M366 180 L 390 200 L 366 220"/>
    </g>
    <g stroke="url(#arrow)" stroke-width="5">
      <path d="M268 200 H 384"/><path d="M366 182 L 388 200 L 366 218"/>
    </g>
  </g>

  <!-- Bilingual caption, centred below the icon labels. -->
  <text x="330" y="374" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="16" font-weight="500" fill="#e9f4ff" fill-opacity=".92" letter-spacing=".2">Boreas'ı Uygulamalar'a sürükleyin · Drag Boreas to Applications</text>
</svg>
