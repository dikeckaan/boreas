<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Boreas app icon, final artwork ("Kutup Işığı"): aurora over a night sky, frosted three-blade fan.
       Refined from logo-concept-aurora.svg: thicker blades, inner shade and a dark edge so the fan
       reads at small sizes, soft drop shadow under the blades, tile shadow and top sheen.
       Used for the 128 px and larger icon sizes; logo-small.svg covers 16-64 px. -->
  <defs>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#040a1c"/><stop offset=".55" stop-color="#0c1938"/><stop offset="1" stop-color="#1b1243"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="540" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#29c9ff" stop-opacity=".22"/><stop offset="1" stop-color="#29c9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aur1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2cffb0" stop-opacity="0"/><stop offset=".35" stop-color="#2cffb0" stop-opacity=".9"/><stop offset=".7" stop-color="#29c9ff" stop-opacity=".75"/><stop offset="1" stop-color="#a45cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aur2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a45cff" stop-opacity="0"/><stop offset=".5" stop-color="#a45cff" stop-opacity=".75"/><stop offset="1" stop-color="#ff5cc8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#e2f2ff" stop-opacity=".93"/><stop offset="1" stop-color="#86c9ff" stop-opacity=".8"/>
    </linearGradient>
    <radialGradient id="hubFill" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#22386a"/><stop offset="1" stop-color="#081228"/>
    </radialGradient>
    <filter id="blur40" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur18" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
    </filter>
    <filter id="bladeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
    </filter>
    <!-- Inner shade: a blue rim along the trailing edge of each blade gives it thickness. -->
    <filter id="innerShade" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="26" result="b"/>
      <feOffset in="b" dx="-28" dy="-30" result="o"/>
      <feComposite in="SourceAlpha" in2="o" operator="out" result="rim"/>
      <feFlood flood-color="#1f6cc4" flood-opacity=".8"/>
      <feComposite in2="rim" operator="in" result="shade"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/></feMerge>
    </filter>
    <path id="blade" d="M512 512 C 416 452, 380 280, 492 176 C 570 106, 714 146, 714 250 C 714 372, 602 458, 512 512 Z"/>
    <g id="fan">
      <use href="#blade"/>
      <use href="#blade" transform="rotate(120 512 512)"/>
      <use href="#blade" transform="rotate(240 512 512)"/>
    </g>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" filter="url(#tileShadow)"/>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <g filter="url(#blur40)">
      <path d="M60 360 C 260 220, 520 420, 980 230 L 980 340 C 560 520, 280 330, 60 470 Z" fill="url(#aur1)"/>
      <path d="M60 520 C 300 420, 600 600, 980 420 L 980 500 C 620 680, 320 500, 60 610 Z" fill="url(#aur2)"/>
    </g>
    <rect width="1024" height="1024" fill="url(#halo)"/>
    <g fill="#fff">
      <circle cx="220" cy="210" r="5"/><circle cx="790" cy="170" r="4"/><circle cx="860" cy="330" r="3"/>
      <circle cx="170" cy="760" r="3"/><circle cx="640" cy="140" r="3"/><circle cx="330" cy="150" r="2.5" fill-opacity=".7"/>
      <circle cx="880" cy="760" r="2.5" fill-opacity=".6"/>
      <path d="M790 152 L 793 167 L 808 170 L 793 173 L 790 188 L 787 173 L 772 170 L 787 167 Z" fill-opacity=".9"/>
    </g>

    <!-- Fan: shadow, cyan glow, frosted blades with inner shade and a dark edge, hub. -->
    <use href="#fan" filter="url(#bladeShadow)"/>
    <use href="#fan" fill="#29c9ff" filter="url(#blur18)" opacity=".6"/>
    <g filter="url(#innerShade)">
      <use href="#blade" fill="url(#glass)"/>
    </g>
    <g filter="url(#innerShade)" transform="rotate(120 512 512)">
      <use href="#blade" fill="url(#glass)"/>
    </g>
    <g filter="url(#innerShade)" transform="rotate(240 512 512)">
      <use href="#blade" fill="url(#glass)"/>
    </g>
    <use href="#fan" fill="none" stroke="#06183a" stroke-opacity=".45" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="512" cy="512" r="66" fill="url(#hubFill)"/>
    <circle cx="512" cy="512" r="66" fill="none" stroke="#fff" stroke-width="10" stroke-opacity=".9"/>
    <circle cx="494" cy="494" r="12" fill="#fff" fill-opacity=".35"/>

    <rect width="1024" height="1024" fill="url(#sheen)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="6"/>
  </g>
</svg>
